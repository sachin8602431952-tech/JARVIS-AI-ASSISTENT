    const chips=[
      'status report','open youtube','mausam batao Delhi','set a 5 minute timer',
      'add task submit project report','show tasks','note down buy groceries',
      'calculate 1450 * 12','help'
    ];
    $('#chips').innerHTML=chips.map(c=>`<button class="chip" data-cmd="${esc(c)}">${esc(c)}</button>`).join('');
    $$('#chips .chip').forEach(b=>b.onclick=()=>Brain.process(b.dataset.cmd));
  },

  renderSysInfo(){
    const el=$('#sysInfo');
    if(!el) return;
    const tz=S.profile.timezone;
    el.innerHTML=`
      <div class="kv"><span>Assistant</span><b>ROBERT v1.0</b></div>
      <div class="kv"><span>Owner</span><b>${esc(S.profile.name)}</b></div>
      <div class="kv"><span>Language</span><b>${esc(S.profile.language)}</b></div>
      <div class="kv"><span>Timezone</span><b>${esc(tz)}</b></div>
      <div class="kv"><span>Voice engine</span><b>${Voice.supported?'Web Speech':'Unavailable'}</b></div>
      <div class="kv"><span>Native shell</span><b>${Bridge.available?'Linked':'Not installed'}</b></div>
      <div class="kv"><span>Tools</span><b>${Tools.list().length}</b></div>`;
  },

  /* ---------- right panel ---------- */
  renderLogsIfVisible(){ if(this.tab==='logs' && $('#tabBody')) this.renderTab(); },

  renderTab(){
    const body=$('#tabBody'); if(!body) return;
    const fn={profile:this.renderProfile, perms:this.renderPerms, data:this.renderData, auto:this.renderAuto, logs:this.renderLogs}[this.tab];
    body.innerHTML = fn? fn.call(this) : '';
    if(this.tab==='profile') this.fillVoiceSelect();
  },

  renderProfile(){
    const p=S.profile;
    const voiceOpts=(Voice.voices||[]).map(v=>`<option value="${esc(v.name)}" ${v.name===p.voice.name?'selected':''}>${esc(v.name)} · ${esc(v.lang)}</option>`).join('');
    return `
      <div class="card-title">User Profile</div>
      <div class="field"><label>Preferred name</label>
        <input type="text" data-bind="profile.name" value="${esc(p.name)}" placeholder="Boss">
      </div>
      <div class="field"><label>Preferred language</label>
        <select data-bind="profile.language">
          <option value="hinglish" ${p.language==='hinglish'?'selected':''}>Hinglish (recommended)</option>
          <option value="english" ${p.language==='english'?'selected':''}>English</option>
          <option value="hindi" ${p.language==='hindi'?'selected':''}>हिन्दी</option>
        </select>
      </div>
      <div class="field"><label>Personality</label>
        <select data-bind="profile.personality">
          <option value="jarvis" ${p.personality==='jarvis'?'selected':''}>JARVIS — calm & concise</option>
          <option value="friendly" ${p.personality==='friendly'?'selected':''}>Friendly & warm</option>
          <option value="formal" ${p.personality==='formal'?'selected':''}>Formal & professional</option>
          <option value="minimal" ${p.personality==='minimal'?'selected':''}>Minimal — answers only</option>
        </select>
      </div>

      <div class="card-title" style="margin-top:16px">Voice</div>
      <div class="toggle-row">
        <div class="tl"><b>Voice output</b><span>Speak every reply aloud</span></div>
        <label class="switch"><input type="checkbox" data-bind="profile.voice.enabled" ${p.voice.enabled?'checked':''}><span class="sl"></span></label>
      </div>
      <div class="toggle-row">
        <div class="tl"><b>Wake word listening</b><span>Always-on “${esc(p.wakeWord)}” detection</span></div>
        <label class="switch"><input type="checkbox" data-bind="profile.wakeWordEnabled" ${p.wakeWordEnabled?'checked':''}><span class="sl"></span></label>
      </div>
      <div class="toggle-row">
        <div class="tl"><b>Continuous conversation</b><span>Stay awake — no need to repeat the wake word</span></div>
        <label class="switch"><input type="checkbox" data-bind="profile.continuous" ${p.continuous?'checked':''}><span class="sl"></span></label>
      </div>
      <div class="toggle-row">
        <div class="tl"><b>Proactive mode</b><span>Surface reminders and next steps unprompted</span></div>
        <label class="switch"><input type="checkbox" data-bind="profile.proactive" ${p.proactive?'checked':''}><span class="sl"></span></label>
      </div>
      <div class="field" style="margin-top:12px"><label>Wake word</label>
        <input type="text" data-bind="profile.wakeWord" value="${esc(p.wakeWord)}" placeholder="robert">
      </div>
      <div class="field"><label>Voice <span class="range-val">${(Voice.voices||[]).length} found</span></label>
        <select id="voiceSelect" data-bind="profile.voice.name">
          <option value="">System default</option>${voiceOpts}
        </select>
      </div>
      <div class="field"><label>Speed <span class="range-val" id="rvRate">${p.voice.rate}</span></label>
        <input type="range" min="0.5" max="2" step="0.05" data-bind="profile.voice.rate" value="${p.voice.rate}">
      </div>
      <div class="field"><label>Pitch <span class="range-val" id="rvPitch">${p.voice.pitch}</span></label>
        <input type="range" min="0" max="2" step="0.05" data-bind="profile.voice.pitch" value="${p.voice.pitch}">
      </div>
      <div class="field"><label>Volume <span class="range-val" id="rvVol">${p.voice.volume}</span></label>
        <input type="range" min="0" max="1" step="0.05" data-bind="profile.voice.volume" value="${p.voice.volume}">
      </div>
      <div class="field"><label>Speech input language</label>
        <select data-bind="profile.sttLang">
          ${['en-IN','en-US','hi-IN','en-GB'].map(l=>`<option value="${l}" ${p.sttLang===l?'selected':''}>${l}</option>`).join('')}
        </select>
      </div>

      <div class="card-title" style="margin-top:16px">Cloud Brain (optional)</div>
      <div class="field"><label>API key</label>
        <input type="password" data-bind="profile.llm.apiKey" value="${esc(p.llm.apiKey)}" placeholder="sk-… (stored locally only)">
      </div>
      <div class="field"><label>Model</label>
        <input type="text" data-bind="profile.llm.model" value="${esc(p.llm.model)}" placeholder="gpt-4o-mini">
      </div>
      <div class="btn-row">
        <button class="btn ghost" data-act="testVoice">Test voice</button>
        <button class="btn ghost" data-act="resetAll">Reset all data</button>
      </div>`;
  },

  fillVoiceSelect(){
    const sel=$('#voiceSelect'); if(!sel) return;
    const cur=S.profile.voice.name;
    sel.innerHTML=`<option value="">System default</option>`+
      (Voice.voices||[]).map(v=>`<option value="${esc(v.name)}" ${v.name===cur?'selected':''}>${esc(v.name)} · ${esc(v.lang)}</option>`).join('');
  },

  renderPerms(){
    const rows=Object.keys(PERM_META).map(k=>{
      const lvl=PermissionManager.level(k);
      const meta=PERM_META[k];
      return `
      <div class="perm">
        <div class="perm-h"><b>${esc(meta.label)}</b><code>${esc(k)}</code></div>
        <p>${esc(meta.desc)}</p>
        <div class="seg" data-perm="${k}">
          <button class="allow ${lvl==='allow'?'active':''}" data-lvl="allow">Allow</button>
          <button class="ask ${lvl==='ask'?'active':''}" data-lvl="ask">Ask</button>
          <button class="deny ${lvl==='deny'?'active':''}" data-lvl="deny">Deny</button>
        </div>
      </div>`;
    }).join('');
    return `<div class="card-title">Permission Manager</div>
      <p style="font-size:11px;color:#4a5f76;margin-bottom:10px;line-height:1.5">
        Every sensitive action passes through this gate. “Ask” prompts you before each use; “Deny” blocks the module entirely.
      </p>${rows}
      <div class="btn-row">
        <button class="btn ghost" data-act="permAllAllow">Allow all</button>
        <button class="btn danger" data-act="permAllDeny">Deny all</button>
      </div>`;
  },

  renderData(){
    const tasks=S.memory.tasks;
    const rems=S.memory.reminders.filter(r=>!r.fired).sort((a,b)=>a.at-b.at);
    const notes=S.memory.notes;
    const taskHTML= tasks.length? tasks.map((x,i)=>`
      <div class="item ${x.done?'done':''}">
        <div class="ck" data-task-toggle="${x.id}">✓</div>
        <div class="body"><b>${esc(x.text)}</b><span>${x.done?'completed':'pending'} · #${i+1}</span></div>
        <button class="x" data-task-del="${x.id}">×</button>
      </div>`).join('') : `<div class="empty">No tasks yet.<br>Say “add task …”</div>`;

    const remHTML= rems.length? rems.map(r=>`
      <div class="item">
        <div class="body"><b>${esc(r.text)}</b><span>${new Date(r.at).toLocaleString([],{weekday:'short',hour:'2-digit',minute:'2-digit'})}</span></div>
        <button class="x" data-rem-del="${r.id}">×</button>
      </div>`).join('') : `<div class="empty">No active reminders.</div>`;

    const noteHTML= notes.length? notes.map(n=>`
      <div class="item">
        <div class="body"><b>${esc(n.text)}</b><span>${new Date(n.ts).toLocaleString([],{hour:'2-digit',minute:'2-digit'})}</span></div>
        <button class="x" data-note-del="${n.id}">×</button>
      </div>`).join('') : `<div class="empty">No notes yet.<br>Say “note down …”</div>`;

    return `
      <div class="card-title">Tasks (${tasks.filter(x=>!x.done).length} pending)</div>
      ${taskHTML}
      <div class="card-title" style="margin-top:16px">Reminders (${rems.length})</div>
      ${remHTML}
      <div class="card-title" style="margin-top:16px">Notes (${notes.length})</div>
      ${noteHTML}`;
  },

  renderAuto(){
    const cmdRows=S.memory.customCommands.length? S.memory.customCommands.map(c=>`
      <div class="item">
        <div class="body"><b>“${esc(c.trigger)}”</b><span>→ ${esc(c.response)}</span></div>
        <button class="x" data-cmd-del="${c.id}">×</button>
      </div>`).join('') : `<div class="empty">No custom commands yet.</div>`;

    const routines=this.defaultRoutines();
    const routineRows=routines.map(r=>`
      <div class="item">
        <div class="body"><b>${esc(r.name)}</b><span>trigger: “${esc(r.trigger)}” · ${r.actions.length} step(s)</span></div>
        <button class="x" data-run-routine="${esc(r.trigger)}" title="Run">▸</button>
      </div>`).join('');

    const actionOpts=Object.keys(ROUTINE_ACTIONS).map(k=>`<option value="${k}">${esc(ROUTINE_ACTIONS[k].label)}</option>`).join('');

    return `
      <div class="card-title">Custom Commands</div>
      <div class="field"><label>Trigger phrase</label><input type="text" id="ccTrigger" placeholder="good morning boss"></div>
      <div class="field"><label>ROBERT's response</label><textarea id="ccResponse" placeholder="Good morning! Aaj ka plan banaate hain."></textarea></div>
      <button class="btn full" data-act="addCustom">Add command</button>
      <div style="margin-top:10px">${cmdRows}</div>

      <div class="card-title" style="margin-top:18px">Built-in Routines</div>
      ${routineRows}

      <div class="card-title" style="margin-top:18px">Build a Routine</div>
      <div class="field"><label>Routine name</label><input type="text" id="rtName" placeholder="Deep Work"></div>
      <div class="field"><label>Trigger phrase</label><input type="text" id="rtTrigger" placeholder="start deep work"></div>
      <div class="field"><label>Steps (hold Ctrl / Cmd to multi-select)</label>
        <select id="rtActions" multiple size="6" style="min-height:120px">${actionOpts}</select>
      </div>
      <button class="btn full" data-act="addRoutine">Create routine</button>
      ${S.memory.routines.length? `<div style="margin-top:10px">${S.memory.routines.map(r=>`
        <div class="item">
          <div class="body"><b>${esc(r.name)}</b><span>trigger: “${esc(r.trigger)}” · ${r.actions.length} step(s)</span></div>
          <button class="x" data-rt-del="${r.id}">×</button>
        </div>`).join('')}</div>`:''}`;
  },

  defaultRoutines(){
    const userBuilt=S.memory.routines.map(r=>({name:r.name, trigger:r.trigger, actions:r.actions, user:true}));
    const built=[
      {name:'Good Morning', trigger:'good morning', actions:['greeting','weather','tasks','openCalendar']},
      {name:'Study Mode',   trigger:'start study mode', actions:['greeting','focusTimer','music']},
      {name:'Work Mode',    trigger:'work mode', actions:['openMail','openCalendar','tasks']},
      {name:'Night Mode',   trigger:'night mode', actions:['agenda','nightMode']}
    ];
    return built.concat(userBuilt);
  },

  renderLogs(){
    if(!S.logs.length) return `<div class="card-title">Activity Log</div><div class="empty">No activity recorded yet.</div>`;
    const rows=S.logs.slice(0,80).map(l=>{
      const time=new Date(l.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
      return `<div class="log ${esc(l.type)}"><span class="ts">${time}</span>${esc(l.msg)}</div>`;
    }).join('');
    return `<div class="card-title">Activity Log (${S.logs.length})</div>${rows}
      <div class="btn-row"><button class="btn ghost full" data-act="clearLogs">Clear log</button></div>`;
  },

  /* ---------- field binding ---------- */
  onField(e){
    const el=e.target;
    const bind=el.dataset.bind;
    if(bind){
      let val = el.type==='checkbox' ? el.checked : el.value;
      if(el.type==='range'||el.type==='number') val=Number(val);
      setPath(S,bind,val);
      save();
      const rv={ 'profile.voice.rate':'rvRate','profile.voice.pitch':'rvPitch','profile.voice.volume':'rvVol' }[bind];
      if(rv){ const n=$('#'+rv); if(n) n.textContent=val; }
      if(bind==='profile.wakeWordEnabled'){
        if(val){ Voice.start('wake'); } else { Voice.stop(); }
      }
      if(bind==='profile.wakeWord'){ this.renderChips(); }
      if(bind==='profile.language'){ if(Voice.rec) Voice.rec.lang=Voice.recLang(); }
      if(bind==='profile.name'){ this.renderSysInfo(); }
      this.renderPills(); this.renderModules();
    }
    /* custom textarea id captures handled on click */
  },

  onClick(e){
    const b=e.target.closest('button');
    if(!b) return;
    const permKey=b.closest('[data-perm]');
    if(permKey){
      const k=permKey.dataset.perm;
      S.permissions[k].level=b.dataset.lvl; save();
      Log.add('perm',`${k} set to ${b.dataset.lvl}`);
      this.renderTab(); this.renderPills(); this.renderModules(); this.renderSysInfo();
      return;
    }
    const taskToggle=b.dataset.taskToggle;
    if(taskToggle){
      const task=S.memory.tasks.find(x=>x.id===taskToggle);
      if(task){ task.done=!task.done; save(); this.renderTab(); }
      return;
    }
    const taskDel=b.dataset.taskDel;
    if(taskDel){ S.memory.tasks=S.memory.tasks.filter(x=>x.id!==taskDel); save(); this.renderTab(); return; }
    const remDel=b.dataset.remDel;
    if(remDel){ S.memory.reminders=S.memory.reminders.filter(x=>x.id!==remDel); save(); this.renderTab(); return; }
    const noteDel=b.dataset.noteDel;
    if(noteDel){ S.memory.notes=S.memory.notes.filter(x=>x.id!==noteDel); save(); this.renderTab(); return; }
    const cmdDel=b.dataset.cmdDel;
    if(cmdDel){ S.memory.customCommands=S.memory.customCommands.filter(x=>x.id!==cmdDel); save(); this.renderTab(); return; }
    const rtDel=b.dataset.rtDel;
    if(rtDel){ S.memory.routines=S.memory.routines.filter(x=>x.id!==rtDel); save(); this.renderTab(); return; }
    const runRt=b.dataset.runRoutine;
    if(runRt){
      const r=this.defaultRoutines().find(x=>x.trigger===runRt);
      if(r) Automation.runRoutine({name:r.name, actions:r.actions});
      return;
    }

    switch(b.dataset.act){
      case 'testVoice':
        Voice.speak(t({hi_en:`Namaste ${S.profile.name}, main ROBERT hoon. Aapka personal assistant.`,en:`Hello ${S.profile.name}, I am ROBERT, your personal assistant.`,hi:`नमस्ते ${S.profile.name}, मैं ROBERT हूँ।`}));
        break;
      case 'resetAll':
        Modal.confirm({tag:'Danger zone',title:'Reset everything?',body:'This wipes your profile, permissions, tasks, notes, reminders, routines and logs from this browser. This cannot be undone.',ok:'Erase all data',danger:true})
          .then(ok=>{ if(ok){ localStorage.removeItem(STORE_KEY); location.reload(); } });
        break;
      case 'permAllAllow':
        Object.keys(PERM_META).forEach(k=>S.permissions[k].level='allow'); save(); this.renderTab(); this.renderPills(); this.renderModules();
        break;
      case 'permAllDeny':
        Object.keys(PERM_META).forEach(k=>S.permissions[k].level='deny'); save(); this.renderTab(); this.renderPills(); this.renderModules(); Voice.stop();
        break;
      case 'clearLogs':
        S.logs=[]; save(); this.renderTab(); break;
      case 'addCustom':{
        const trig=$('#ccTrigger'), resp=$('#ccResponse');
        if(!trig.value.trim()||!resp.value.trim()){ Modal.alert({title:'Missing fields',body:'Please provide both a trigger phrase and a response.'}); return; }
        S.memory.customCommands.push({id:uid(), trigger:trig.value.trim(), response:resp.value.trim()});
        save(); Log.add('system','Custom command added: '+trig.value.trim()); this.renderTab();
        UI.addMessage('system',`Custom command registered · “${esc(trig.value.trim())}”`);
        break;
      }
      case 'addRoutine':{
        const nm=$('#rtName').value.trim();
        const tr=$('#rtTrigger').value.trim();
        const acts=Array.from($('#rtActions').selectedOptions).map(o=>o.value);
        if(!nm||!tr||!acts.length){ Modal.alert({title:'Incomplete routine',body:'Provide a name, a trigger phrase and at least one step.'}); return; }
        S.memory.routines.push({id:uid(), name:nm, trigger:tr, actions:acts});
        save(); Log.add('system','Routine created: '+nm); this.renderTab();
        UI.addMessage('system',`Routine registered · “${esc(tr)}” → ${acts.length} step(s)`);
        break;
      }
    }
  }
};

/* ========================= 14. BOOT ========================= */
async function boot(){
  Modal.init();
  UI.init();
  Voice.init();
  Scheduler.init();
  Proactive.start();
  Notify.request().then(ok=>{ if(ok && PermissionManager.level('notifications')==='ask'){ /* keep ask */ } });

  UI.addMessage('system','ROBERT core online · modules loading…');
  await sleep(260);
  UI.addMessage('system',`VOICE ${Voice.supported?'✓ ready':'✗ unsupported in this browser'} · BRAIN ✓ · TOOLS ✓ (${Tools.list().length} registered)`);
  await sleep(240);
  UI.addMessage('system',`PERMISSIONS · ${Object.keys(PERM_META).filter(k=>PermissionManager.isAllowed(k)).length}/${Object.keys(PERM_META).length} granted · NATIVE SHELL ${Bridge.available?'✓ linked':'— not installed'}`);
  await sleep(300);

  Log.add('system','ROBERT booted');

  if(S.profile.greetOnStart){
    const h=new Date().getHours();
    const greet = h<12 ? t({hi_en:'Good morning',en:'Good morning',hi:'सुप्रभात'})
                : h<17 ? t({hi_en:'Good afternoon',en:'Good afternoon',hi:'नमस्कार'})
                : t({hi_en:'Good evening',en:'Good evening',hi:'शुभ संध्या'});
    const msg = `${greet}, <b>${esc(S.profile.name)}</b>. ROBERT ${t({hi_en:'aapki seva mein taiyaar hai.',en:'is ready to assist.',hi:'आपकी सेवा में तैयार है।'})}<br><br>`+
      t({
        hi_en:'Mic button dabaayein ya “Hey Robert” boliye. Neeche kuch quick commands bhi diye hain.',
        en:'Tap the mic button or say “Hey Robert”. A few quick commands are listed below.',
        hi:'माइक बटन दबाएँ या “Hey Robert” कहें।'
      });
    UI.say(msg);
  }

  UI.renderTab();
  UI.renderSysInfo();
  UI.renderPills();

  window.addEventListener('online',()=>UI.renderPills());
  window.addEventListener('offline',()=>UI.renderPills());
  window.addEventListener('beforeunload',()=>{ saveNow(); Voice.close && Vision.close(); });
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();

})();
</script>
</body>
</html>
